<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <button type="button" (click)="goHome()" class="btn-back-top" title="Volver a inicio">
        ← Atrás
      </button>
      <h1>La10 - Sistema de Espacios</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      <strong>⚠️ Error:</strong> {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      <strong>✓ Éxito:</strong> {{ successMessage }}
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label for="usuario" class="form-label">Cédula</label>
        <input
          type="text"
          id="usuario"
          class="form-control"
          [(ngModel)]="cedula"
          name="usuario"
          placeholder="Ingresa tu cédula"
          [disabled]="isLoading"
          required
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="password-input-group">
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            id="password"
            class="form-control"
            [(ngModel)]="contrasenia"
            name="password"
            placeholder="Ingresa tu contraseña"
            [disabled]="isLoading"
            required
          >
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading"
            title="Mostrar/Ocultar contraseña"
          >
            {{ mostrarPassword ? '👁️‍🗨️' : '👁️' }}
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="isLoading || !cedula || !contrasenia"
      >
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading">Cargando...</span>
      </button>
    </form>

    <div style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px; text-align: center;">
      <p style="color: #999; font-size: 13px; margin: 0 0 5px 0;">¿No tienes una cuenta?</p>
      <button type="button" style="background: none; border: none; color: #e40b0b; font-weight: 600; font-size: 14px; text-transform: none; cursor: pointer; padding: 0;" routerLink="/registro">
        Regístrate aquí
      </button>
    </div>

    <div class="login-footer" style="margin-top: 20px;">
      <p class="info-text">
        Sistema de gestión de espacios e instalaciones deportivas
      </p>
      <p class="version-text">v1.0</p>
    </div>
  </div>
</div>
