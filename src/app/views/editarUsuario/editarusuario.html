<div class="container mt-4">
  <h2>Editar Usuario</h2>
  <hr>

  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="alert alert-success" role="alert">
    {{ successMessage }}
  </div>

  <div *ngIf="isLoading" class="text-center my-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando datos...</span>
    </div>
  </div>

  <form *ngIf="!isLoading" #userForm="ngForm" (ngSubmit)="guardarCambios(userForm)">
    
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="cedula" class="form-label">Cédula de Identidad</label>
        <input type="text" id="cedula" name="cedula" class="form-control bg-light" 
               [(ngModel)]="usuario.cedula" readonly>
        <small class="text-muted">La cédula no puede modificarse.</small>
      </div>

      <div class="col-md-6 mb-3">
        <label for="email" class="form-label">Correo Electrónico *</label>
        <input type="email" id="email" name="email" class="form-control" 
               [(ngModel)]="usuario.email" required email #emailRef="ngModel"
               [class.is-invalid]="emailRef.invalid && emailRef.touched">
        <div class="invalid-feedback">Por favor introduce un email válido.</div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="nombre" class="form-label">Nombre *</label>
        <input type="text" id="nombre" name="nombre" class="form-control" 
               [(ngModel)]="usuario.nombre" required #nombreRef="ngModel"
               [class.is-invalid]="nombreRef.invalid && nombreRef.touched">
      </div>

      <div class="col-md-6 mb-3">
        <label for="apellido" class="form-label">Apellido *</label>
        <input type="text" id="apellido" name="apellido" class="form-control" 
               [(ngModel)]="usuario.apellido" required #apellidoRef="ngModel"
               [class.is-invalid]="apellidoRef.invalid && apellidoRef.touched">
      </div>
    </div>

    <div class="card my-4 p-3 bg-light">
      <h5 class="card-title">Seguridad (Opcional)</h5>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="claveActual" class="form-label">Contraseña Actual</label>
          <input type="password" id="claveActual" name="claveActual" class="form-control" 
                 [(ngModel)]="usuario.claveActual" placeholder="Ingresa tu contraseña actual si deseas cambiarla">
        </div>
        <div class="col-md-6 mb-3">
          <label for="nuevaClave" class="form-label">Nueva Contraseña</label>
          <input type="password" id="nuevaClave" name="nuevaClave" class="form-control" 
                 [(ngModel)]="usuario.nuevaClave" placeholder="Nueva contraseña">
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-secondary" routerLink="/reservas">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid || isSaving">
        <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1"></span>
        {{ isSaving ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </div>

  </form>
</div>
