<div class="login-container">
  <div class="login-box">

    <div class="login-header">
      <button type="button" (click)="goHome()" class="btn-back-top" title="Volver a inicio">
        ← Atrás
      </button>
      <h1>Editar Cuenta</h1>
      <p>Modifica los datos de tu perfil administrativo</p>
    </div>

    <!-- Alerta Dinámica de Éxito NAtiva de tu App -->
    <div class="alert alert-success" *ngIf="successMessage" style="margin-bottom: 20px; background: #dcfce7; color: #166534; padding: 12px; border-radius: 6px; border-left: 4px solid #16a34a; font-size: 14px;">
      <strong>✓ Operación Exitosa</strong>
      {{ successMessage }}
    </div>

    <!-- Alerta Dinámica de Error -->
    <div class="alert alert-error" *ngIf="errorMessage" style="margin-bottom: 20px; background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 6px; border-left: 4px solid #dc2626; font-size: 14px;">
      <strong>⚠️ Error del Sistema</strong>
      {{ errorMessage }}
    </div>

    <!-- Alerta preventiva de Sesión -->
    <div class="alert alert-error" *ngIf="!usuario.idUsuario && !successMessage && !errorMessage" style="margin-bottom: 20px; background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px;">
      <strong>⚠️ Error:</strong> No se encontró la sesión del usuario.
    </div>

    <form class="login-form form-grid" #userForm="ngForm" (ngSubmit)="guardarCambios(userForm)">

      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" name="nombre" [(ngModel)]="usuario.nombre" required>
      </div>

      <div class="form-group">
        <label class="form-label">Apellido</label>
        <input type="text" class="form-control" name="apellido" [(ngModel)]="usuario.apellido" required>
      </div>

      <div class="form-group">
        <label class="form-label">Cédula</label>
        <input type="text" class="form-control" name="cedula" [(ngModel)]="usuario.cedula" required disabled style="background-color: #f5f5f5; color: #999;">
      </div>

      <div class="form-group">
        <label class="form-label">Correo Electrónico *</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="usuario.email" required placeholder="ejemplo@correo.com">
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña Actual</label>
        <input type="password" class="form-control" name="claveActual" [(ngModel)]="usuario.claveActual" placeholder="********">
      </div>

      <div class="form-group">
        <label class="form-label">Nueva Contraseña</label>
        <input type="password" class="form-control" name="nuevaClave" [(ngModel)]="usuario.nuevaClave" placeholder="Nueva contraseña">
      </div>

      <button type="submit" class="btn btn-primary btn-block full-width" style="margin-top: 20px;" [disabled]="isSaving">
        {{ isSaving ? 'GUARDANDO...' : 'GUARDAR CAMBIOS' }}
      </button>

    </form>

  </div>
</div>
