<div class="login-container">
  <div class="login-box">
    
    <div class="login-header">
      <button type="button" (click)="goHome()" class="btn-back-top" title="Volver a inicio">
        ← Atrás
      </button>
      <h1>Crear Cuenta</h1>
      <p>Completa tus datos para registrarte</p>
    </div>

    <form class="login-form" (ngSubmit)="onRegister()">
      
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" name="nombre" [(ngModel)]="usuario.nombre" required>
      </div>

      <div class="form-group">
        <label class="form-label">Apellido</label>
        <input type="text" class="form-control" name="apellido" [(ngModel)]="usuario.apellido" required>
      </div>

      <div class="form-group">
        <label class="form-label">Cédula</label>
        <input type="text" class="form-control" name="cedula" [(ngModel)]="usuario.cedula" required>
      </div>

      <div class="form-group">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="usuario.email" required placeholder="ejemplo@correo.com">
      </div>

      <div class="form-group">
        <label class="form-label">Teléfono</label>
        <input type="text" class="form-control" name="telefono" [(ngModel)]="usuario.telefono" required>
      </div>

      <div class="form-group">
        <label class="form-label">Fecha de Nacimiento</label>
        <input type="date" class="form-control" name="fechaNacimiento" [(ngModel)]="usuario.fechaNacimiento" required>
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" name="contrasenia" [(ngModel)]="usuario.contrasenia" required placeholder="********">
      </div>

      <!-- Este botón ahora tiene la clase btn-primary del login y enviará los datos -->
      <button type="submit" class="btn btn-primary btn-block">
        Registrarse
      </button>

    </form>

    <div class="login-footer">
      <button class="toggle-password" style="position: static; font-size: 14px; color: #e40b0b;" routerLink="/login">
        ¿Ya tienes cuenta? Inicia sesión
      </button>
    </div>

  </div>
</div>
